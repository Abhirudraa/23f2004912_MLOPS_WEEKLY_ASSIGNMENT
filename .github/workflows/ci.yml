name: CI

on:
  push:
    branches: [ main, week_* ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0 setuptools wheel
          # Install DVC with GCS support, plus other packages
          pip install dvc[gs] pytest pandas scikit-learn joblib
          # Install CML from official script (not pip)
          curl -fsSL https://cml.dev/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ----- Workload Identity Federation (no JSON key) -----
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/712973134625/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@project-ad35ebae-2568-47b9-83a.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure DVC remote
        run: |
          dvc remote add --force gcs_remote gs://mlops-course-week2-ad35ebae-2568-47b9-83a-unique/iris-pipeline
          dvc remote default gcs_remote
          dvc remote modify --local gcs_remote projectname project-ad35ebae-2568-47b9-83a

      - name: Pull data and models
        run: dvc pull

      - name: Run tests and generate metrics
        run: |
          pytest tests/ --junitxml=test-results.xml
          python scripts/evaluate.py > metrics.txt

      - name: Report with CML
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Report" > report.md
          echo "### Model Metrics" >> report.md
          cat metrics.txt >> report.md
          echo "" >> report.md
          echo "### Test Output" >> report.md
          pytest tests/ --junitxml=test-results.xml >> report.md 2>&1
          cml comment create report.md
