name: CI

on:
  push:
    branches: [ main, week_* ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install dvc[gs] pytest pandas scikit-learn joblib
          curl -fsSL https://cml.dev/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Authenticate using Workload Identity Federation
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712973134625/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@project-ad35ebae-2568-47b9-83a.iam.gserviceaccount.com
          project_id: project-ad35ebae-2568-47b9-83a

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Export ADC credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      # Debug authentication (can remove after CI succeeds)
      - name: Verify Google Cloud Authentication
        run: |
          gcloud auth list
          gcloud config list
          gcloud storage ls gs://mlops-course-week2-ad35ebae-2568-47b9-83a-unique

      - name: Configure DVC remote
        run: |
          dvc remote add --force gcs_remote gs://mlops-course-week2-ad35ebae-2568-47b9-83a-unique/iris-pipeline
          dvc remote default gcs_remote
          dvc remote modify --local gcs_remote projectname project-ad35ebae-2568-47b9-83a

      - name: Pull data and models
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          dvc pull -v

      - name: Run tests
        run: |
          pytest tests/ --junitxml=test-results.xml

      - name: Generate metrics
        run: |
          python scripts/evaluate.py > metrics.txt

      - name: Report with CML
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI Report"
            echo ""
            echo "### Model Metrics"
            cat metrics.txt
            echo ""
            echo "### Test Results"
            if [ -f test-results.xml ]; then
              echo "Tests completed successfully."
            else
              echo "Test report not found."
            fi
          } > report.md

          cml comment create report.md
