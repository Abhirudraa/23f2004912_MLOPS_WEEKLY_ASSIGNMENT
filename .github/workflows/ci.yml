name: CI

on:
  push:
    branches:
      - main
      - "week_*"
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install dvc[gs] pytest pandas scikit-learn joblib skops mlflow
      # Authenticate to Google Cloud using Workload Identity Federation
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712973134625/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@project-ad35ebae-2568-47b9-83a.iam.gserviceaccount.com
          project_id: project-ad35ebae-2568-47b9-83a

      # Install gcloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Export ADC credentials for DVC/gcsfs
      - name: Export ADC credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      # Verify authentication
      - name: Verify Google Cloud Authentication
        run: |
          gcloud auth list
          gcloud config list
          gcloud storage ls gs://mlops-course-week2-ad35ebae-2568-47b9-83a-unique

      # Configure DVC remote
      - name: Configure DVC
        run: |
          dvc remote add --force gcs_remote gs://mlops-course-week2-ad35ebae-2568-47b9-83a-unique/iris-pipeline
          dvc remote default gcs_remote
          dvc remote modify --local gcs_remote projectname project-ad35ebae-2568-47b9-83a

      # Pull artifacts
      - name: Pull data and model
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          dvc pull -v

      # Run tests
      - name: Run tests
        run: |
          pytest tests/ --junitxml=test-results.xml

      # Evaluate model
      - name: Generate metrics
        run: |
          python scripts/evaluate.py > metrics.txt

      # Install official CML
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      # Create PR report
      - name: Report with CML
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Report" > report.md
          echo "" >> report.md
          echo "### Model Metrics" >> report.md
          cat metrics.txt >> report.md
          echo "" >> report.md
          echo "### Test Summary" >> report.md
          echo "✅ All tests passed." >> report.md

          cml comment create report.md
