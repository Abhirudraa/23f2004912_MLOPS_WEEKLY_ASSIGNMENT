name: Continuous Deployment

on:
  push:
    branches:
      - week_6

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-ad35ebae-2568-47b9-83a
  REGION: asia-south1
  ZONE: asia-south1-a
  REPOSITORY: iris-api
  IMAGE: iris-api
  CLUSTER: iris-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712973134625/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@project-ad35ebae-2568-47b9-83a.iam.gserviceaccount.com
          project_id: project-ad35ebae-2568-47b9-83a

      # Install Google Cloud SDK + GKE Auth Plugin
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # Verify plugin
      - name: Verify GKE Auth Plugin
        run: |
          gke-gcloud-auth-plugin --version
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      # Install kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # Configure Docker Authentication
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      # Get GKE Credentials
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER \
            --zone $ZONE \
            --project $PROJECT_ID

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}

      # Deploy to GKE
      - name: Deploy to GKE
        run: |
          kubectl set image deployment/iris-api \
            iris-api=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}

          kubectl rollout status deployment/iris-api

      # Verify Deployment
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
