name: Continuous Deployment

on:
  push:
    branches:
      - week_7

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-ad35ebae-2568-47b9-83a
  REGION: asia-south1
  ZONE: asia-south1-a
  REPOSITORY: iris-api
  IMAGE: iris-api
  CLUSTER: iris-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/712973134625/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@project-ad35ebae-2568-47b9-83a.iam.gserviceaccount.com
          project_id: project-ad35ebae-2568-47b9-83a

      # Install Google Cloud SDK + GKE Auth Plugin
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # Verify GKE Auth Plugin
      - name: Verify GKE Auth Plugin
        run: |
          gke-gcloud-auth-plugin --version
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      # Install kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # Configure Docker Authentication
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      # Get GKE Credentials
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER \
            --zone $ZONE \
            --project $PROJECT_ID

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}

      # Update Deployment Image
      - name: Update Deployment Image
        run: |
          kubectl set image deployment/iris-api \
            iris-api=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}

      # Apply Kubernetes Manifests
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      # Wait for Rollout
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/iris-api

      # Verify Deployment
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
          kubectl get hpa

      # Install wrk
      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      # Wait for LoadBalancer
      - name: Wait for LoadBalancer
        run: |
          sleep 30

      # Run Stress Test
      - name: Stress Test
        run: |
          EXTERNAL_IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "Running stress test against http://$EXTERNAL_IP/predict"

          wrk \
            -t4 \
            -c1000 \
            -d30s \
            -s stress/post.lua \
            http://$EXTERNAL_IP/predict
